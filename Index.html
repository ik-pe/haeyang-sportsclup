<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>해양중 스포츠클럽 동아리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f3f5fa;--card:#fff;--ink:#15203b;--sub:#66728c;--line:#e4e8f1;--soft:#f7f8fc;
  --pri:#2f5be8;--pri-d:#2147c4;--pri-2:#eaf0ff;
  --ok:#15924a;--ok-bg:#e6f6ec;--late:#c86c00;--late-bg:#fff2dc;--abs:#d12c2c;--abs-bg:#fde9e9;
  --exc:#7347e0;--exc-bg:#efe9fd;--none:#6b7790;--none-bg:#edf0f5;
  --r:16px;--shadow:0 1px 2px rgba(16,24,40,.04),0 6px 20px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.02em}
small{font-size:12.5px}
.muted{color:var(--sub)}
.hidden{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:10px 15px;background:var(--pri);color:#fff;font-weight:650;white-space:nowrap;transition:background .15s,transform .05s}
.btn:hover{background:var(--pri-d)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--pri-2);color:var(--pri)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--abs-bg);color:var(--abs)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.block{width:100%;padding:14px;font-size:16px;border-radius:13px}
.btn:disabled{opacity:.55;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--sub);padding:8px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.field{display:block;margin-bottom:13px}
.field>span{display:block;font-size:13px;color:var(--sub);margin-bottom:6px;font-weight:650}
.inp{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:#fff;outline:none;min-height:42px}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-2)}
textarea.inp{resize:vertical;min-height:90px}
.inp.big{font-size:18px;padding:13px 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.sec-t{font-size:15px;margin:22px 2px 10px;color:var(--ink)}
.page-t{font-size:22px;margin:6px 2px 4px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--sub)}
.errbox{background:var(--abs-bg);color:var(--abs);border-radius:12px;padding:14px}
.alert{background:var(--abs-bg);color:var(--abs);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.alert.info{background:var(--pri-2);color:var(--pri)}
.alert.warn{background:var(--late-bg);color:var(--late)}
.hint{font-size:12.5px;color:var(--sub);margin:10px 0 0}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--sub);padding:40px 0}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
.spin.dark{border-color:#cfd6e6;border-top-color:var(--pri)}
@keyframes sp{to{transform:rotate(360deg)}}

/* badges & chips */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-late{background:var(--late-bg);color:var(--late)}
.b-abs{background:var(--abs-bg);color:var(--abs)}.b-exc{background:var(--exc-bg);color:var(--exc)}
.b-none{background:var(--none-bg);color:var(--none)}.b-pri{background:var(--pri-2);color:var(--pri)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:999px;font-size:13px;font-weight:650;background:#fff;border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#888)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,#999)}

/* list rows */
.list{padding:4px 14px}
.lrow{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .grow{flex:1;min-width:0}
.lrow b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small{color:var(--sub)}

/* toast, modal */
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:#1d2540;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:100;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:#b42323}
#toast.ok{background:#127a3e}
.modal{position:fixed;inset:0;background:rgba(15,22,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.modal-card{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.modal-card.wide{max-width:860px}
.modal-card h2{font-size:19px;margin-bottom:14px}
.m-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
@media(min-width:700px){.modal{align-items:center;padding:20px}.modal-card{border-radius:20px}}
#confirmLayer{z-index:60}

/* ========== 학생 화면 ========== */
.s-app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.s-head{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(243,245,250,.92);backdrop-filter:blur(8px)}
.s-head b{font-size:17px}
.s-head small{display:block;color:var(--sub)}
.icon-btn{border:0;background:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;box-shadow:var(--shadow);color:var(--sub)}
.s-main{padding:4px 16px 20px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar>div{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;min-width:0;border:0;background:none;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#9aa3b6;font-size:11px;font-weight:650;white-space:nowrap}
.tabbar button.on{color:var(--pri)}
.hello{background:linear-gradient(135deg,#2f5be8,#5a3fe0);color:#fff;padding:20px}
.hello h2{font-size:21px;margin:4px 0}
.hello .mw{opacity:.82;font-size:13.5px}
.hello .chip{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:#fff}
.today{border-left:5px solid var(--c);margin-bottom:10px}
.today.canceled,.sch.canceled{opacity:.6}
.today.canceled .t-time,.sch.canceled .sch-time{text-decoration:line-through}
.t-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.t-time{font-size:22px;font-weight:800;margin:8px 0 2px;letter-spacing:-.02em}
.t-act{margin-top:12px;display:flex;align-items:center;gap:8px}
.note{margin-top:8px;background:var(--soft);padding:9px 11px;border-radius:10px;font-size:13.5px}
.pick-list{display:grid;gap:10px;margin-top:14px}
.pick{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid transparent;border-radius:var(--r);box-shadow:var(--shadow);padding:16px;text-align:left}
.pick:hover{border-color:var(--c)}
.pick .bar{width:6px;align-self:stretch;border-radius:6px;background:var(--c)}
.pick b{font-size:17px;flex:1}
.back{border:0;background:none;color:var(--sub);padding:8px 0;font-weight:650}
.attend-card{border-top:6px solid var(--c);text-align:center;padding:22px 18px}
.attend-card .chip{font-size:15px;padding:6px 14px}
.code-in{font-size:34px;text-align:center;letter-spacing:.5em;padding:14px 0 14px .5em;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
.done-box{margin-top:16px;padding:16px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:650}
.att-err{color:var(--abs);font-size:14px;min-height:20px;margin:8px 0}
.success{text-align:center;padding:34px 20px;margin-top:20px}
.check-anim{width:88px;height:88px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:46px;color:#fff;background:var(--ok);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.check-anim.late{background:var(--late)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.success h2{font-size:23px}
.kv{display:grid;grid-template-columns:70px 1fr;gap:7px 10px;margin:10px 0 0;font-size:14px}
.kv dt{color:var(--sub)}
.kv dd{margin:0}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sumgrid .card{padding:12px;text-align:center}
.sumgrid b{display:block;font-size:22px}
.sumgrid small{color:var(--sub)}
.filters{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:650;white-space:nowrap}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 동아리 선택 화면 */
.pick-wrap{min-height:100vh;padding:28px 18px 40px;background:radial-gradient(1200px 500px at 50% -10%,#dfe7ff,transparent),var(--bg)}
.pick-in{max-width:960px;margin:0 auto}
.pick-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pick-head h1{font-size:26px}
.club-pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cpick{position:relative;text-align:left;border:0;background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:20px 18px 18px;border-top:7px solid var(--c);transition:transform .12s,box-shadow .12s;display:flex;flex-direction:column;gap:6px;min-height:178px}
.cpick:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(16,24,40,.12)}
.cpick .emo{font-size:40px;line-height:1}
.cpick b{font-size:19px;letter-spacing:-.02em}
.cpick .meta{font-size:13px;color:var(--sub)}
.cpick .today-l{margin-top:auto;font-size:13px;background:var(--soft);border-radius:10px;padding:7px 9px}
.cpick.all{--c:#131b33;background:#131b33;color:#fff}
.cpick.all .meta,.cpick.all .today-l{color:#c8cfe0}
.cpick.all .today-l{background:rgba(255,255,255,.08)}
.cur-club{margin:0 12px 12px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:8px}
.cur-club b{color:#fff;flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur-club button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 9px;font-size:12.5px;font-weight:650}
@media(max-width:560px){.club-pick-grid{grid-template-columns:1fr 1fr;gap:10px}.cpick{min-height:150px;padding:14px 12px;border-radius:16px}.cpick .emo{font-size:30px}.cpick b{font-size:15.5px}.cpick .today-l{font-size:12px}}
@media(max-width:860px){.cur-club{margin:0 8px 8px;order:2;flex:0 0 calc(100% - 16px)}}

/* 시간 선택(24시간제) */
.tp{display:inline-flex;align-items:center;gap:4px;flex-wrap:nowrap;white-space:nowrap}
.tp select.inp{width:auto;min-width:68px;flex:none;padding-right:6px}
.tp span{color:var(--sub);font-size:13px;margin-right:4px}
.att-big{width:100%;padding:16px;font-size:18px;border-radius:14px}
.att-window{font-size:12.5px;color:var(--sub);margin-top:6px;text-align:center}
.selbar{display:flex;align-items:center;gap:8px;background:var(--abs-bg);color:var(--abs);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:650}

.dayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.dayrow b{width:52px;flex:none}
.inline-num{width:72px!important;min-width:0!important;display:inline-block;text-align:center;padding:8px 6px!important;min-height:0!important}
.radio-row{display:flex;flex-direction:column;gap:8px}
.radio-row label{display:flex;align-items:flex-start;gap:8px;font-size:14px;cursor:pointer}
.radio-row label b{white-space:nowrap}
.radio-row input{margin-top:3px}
.slowhelp{max-width:420px;margin:0 auto;padding:0 20px;color:var(--sub);font-size:13.5px;line-height:1.6;opacity:0;animation:showlater .4s 8s forwards}
@keyframes showlater{to{opacity:1}}

.sumbtn{border:2px solid transparent;cursor:pointer;font:inherit;color:inherit}
.sumbtn.on{border-color:var(--pri);background:var(--pri-2)}

.ev i{font-style:normal;margin-right:2px}
.ev em{font-style:normal}
.m-only{display:none}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.cal-nav b{font-size:18px}
.cal-nav button{border:0;background:#fff;box-shadow:var(--shadow);border-radius:10px;width:38px;height:38px;font-size:20px}
.cal{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-head div{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:8px 0;background:var(--soft)}
.sun{color:#d33!important}.sat{color:#2a62d8!important}
.cal-cell{min-height:66px;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:4px 3px;cursor:pointer;min-width:0}
.cal-cell:nth-child(7n){border-right:0}
.cal-cell.blank{background:#fbfcfe;cursor:default}
.cal-cell.sel{background:var(--pri-2)}
.cal-d{font-size:12.5px;font-weight:650;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%}
.cal-cell.today .cal-d{background:var(--pri);color:#fff!important}
.ev{display:block;font-size:10.5px;line-height:1.35;color:#fff;background:var(--c);border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650}
.ev.x{background:#c4cad6;text-decoration:line-through}
.ev.more{background:none;color:var(--sub);padding:0 2px}
.sch{border-left:5px solid var(--c);margin-bottom:10px}
.sch-top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.sch-time{font-size:18px;font-weight:800;margin-top:8px}
.sch-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 50% -10%,#dfe7ff,transparent),var(--bg)}
.login-card{width:100%;max-width:380px;padding:28px 22px;text-align:center}
.login-card form{text-align:left;margin-top:20px}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 12px;display:grid;place-items:center;font-size:32px;background:linear-gradient(135deg,#2f5be8,#5a3fe0);box-shadow:0 8px 24px rgba(47,91,232,.35)}
.login-card h1{font-size:24px}

/* ========== 관리자 화면 ========== */
.a-app{display:flex;min-height:100vh}
.a-side{width:236px;flex:none;background:#131b33;color:#c8cfe0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.a-brand{padding:20px 18px 16px;font-weight:800;color:#fff;font-size:15.5px;white-space:nowrap}
.a-brand small{display:block;font-weight:500;color:#8892ad;font-size:12px;margin-top:2px}
.a-nav{display:flex;flex-direction:column;gap:2px;padding:0 10px;flex:1}
.a-nav button{display:flex;align-items:center;gap:10px;border:0;background:none;color:inherit;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left;font-size:14.5px}
.a-nav button:hover{background:rgba(255,255,255,.06)}
.a-nav button.on{background:var(--pri);color:#fff}
.a-nav svg.i{width:19px;height:19px}
.a-user{padding:16px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px}
.a-user b{color:#fff}
.a-user small{color:#8892ad;margin-bottom:8px}
.a-user .btn{background:rgba(255,255,255,.08);color:#dfe4f1;border:0}
.a-main{flex:1;min-width:0;padding:24px 28px 60px}
.a-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.a-title h1{font-size:24px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .inp{width:auto;min-width:150px}
.toolbar .sp{flex:1}
.stat-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.stat{padding:16px}
.stat small{color:var(--sub);font-weight:650}
.stat b{display:block;font-size:28px;margin-top:4px;letter-spacing:-.03em}
.stat b i{font-style:normal;font-size:14px;color:var(--sub);margin-left:2px;font-weight:600}
.stat.ok b{color:var(--ok)}.stat.late b{color:var(--late)}.stat.abs b{color:var(--abs)}
.a-cols{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.dcard{margin-bottom:10px;border-left:5px solid var(--c)}
.dc-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dc-top .grow{flex:1}
.bar{height:9px;background:var(--none-bg);border-radius:9px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#34c172);border-radius:9px;transition:width .4s}
.dc-cnt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;align-items:center}
.dc-cnt b{font-size:16px}
.t-ok{color:var(--ok)}.t-late{color:var(--late)}.t-abs{color:var(--abs)}.t-none{color:var(--none)}.t-exc{color:var(--exc)}
.seg{display:inline-flex;background:#e6eaf3;border-radius:12px;padding:4px;gap:2px;margin-bottom:16px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:650;color:var(--sub);font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tbl-wrap{padding:0;overflow:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:12.5px;color:var(--sub);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{white-space:nowrap;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr:hover td{background:#fafbfe}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .act{white-space:nowrap;text-align:right}
.tbl .act .btn{margin-left:4px}
code.pin{background:var(--late-bg);color:var(--late);padding:2px 7px;border-radius:6px;font-weight:700}
.mini-seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.mini-seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:6px 9px;font-size:12.5px;font-weight:650;color:var(--sub)}
.mini-seg button:last-child{border-right:0}
.mini-seg button.on.ok{background:var(--ok);color:#fff}.mini-seg button.on.late{background:var(--late);color:#fff}
.mini-seg button.on.abs{background:var(--abs);color:#fff}.mini-seg button.on.exc{background:var(--exc);color:#fff}
.flag{display:inline-block;background:#fff1e6;color:#b4540a;border-radius:6px;font-size:11.5px;padding:2px 6px;font-weight:700;margin:1px 2px 1px 0}

function parseDayTimes(c) {
  c = c || {};
  const t = String(c.time || ''), out = {};
  const re = /([월화수목금토일])(?:요일)?\s*(\d{1,2}:\d{2})\s*[~\-]\s*(\d{1,2}:\d{2})/g;
  let m;
  while ((m = re.exec(t))) out[m[1]] = { start: m[2].padStart(5, '0'), end: m[3].padStart(5, '0') };
  const g = t.match(/^\s*(\d{1,2}:\d{2})\s*[~\-]\s*(\d{1,2}:\d{2})\s*$/);

function apiCall(action, payload) {

async function busy(btn, fn) {
  let label;
  if (btn) { btn.disabled = true; label = btn.innerHTML; btn.innerHTML = '<span class="spin' + (btn.classList.contains('sec') || btn.classList.contains('ghost') || btn.classList.contains('danger') ? ' dark' : '') + '"></span>'; }
  try { return await fn(); }
  catch (e) { if (!e.auth && !e.shown) toast(e.message, 'err'); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = label; } }
}
let pollTimer = null;
function stopPoll() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }

function copyText(text) {
  const done = () => toast('복사했습니다', 'ok');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallback());
  } else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('직접 선택해서 복사하세요', 'err'); }
    ta.remove();
  }
}

/* 엑셀 / CSV */
let xlsxLoader = null;
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoader) xlsxLoader = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = res;
    s.onerror = () => { xlsxLoader = null; rej(new Error('엑셀 기능을 불러오지 못했습니다. CSV를 이용하세요.')); };
    document.head.appendChild(s);
  });
  return xlsxLoader;
}
function triggerDownload(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function downloadCSV(name, rows) {
  const esc = v => { v = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const text = '﻿' + rows.map(r => r.map(esc).join(',')).join('\r\n');
  triggerDownload(new Blob([text], { type: 'text/csv;charset=utf-8' }), name.replace(/[\\/:*?"<>|]/g, '_') + '.csv');
}
async function downloadXLSX(name, rows) {
  await loadXLSX();
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = rows[0].map((_, i) => ({ wch: Math.min(40, Math.max(8, ...rows.slice(0, 200).map(r => String(r[i] === undefined ? '' : r[i]).length * 1.6))) }));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '데이터');
  const out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  triggerDownload(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }), name.replace(/[\\/:*?"<>|]/g, '_') + '.xlsx');
}

/* 달력 */
function calNav(ym, fn) {
  const [y, m] = ym.split('-').map(Number);
  return `<div class="cal-nav"><button onclick="${fn}(-1)" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button onclick="${fn}(1)" aria-label="다음 달">›</button></div>`;
}
function calendarGrid(ym, events, sel, pickFn, today) {
  const [y, m] = ym.split('-').map(Number);
  const first = new Date(y, m - 1, 1).getDay();
  const days = new Date(y, m, 0).getDate();
  const byDate = {};
  events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="cal-cell blank"></div>';
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad(d)}`;
    const ev = byDate[ds] || [];
    const w = (first + d - 1) % 7;
    cells += `<div class="cal-cell ${ds === sel ? 'sel' : ''} ${ds === today ? 'today' : ''}" onclick="${pickFn}('${ds}')">
      <span class="cal-d ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${d}</span>
      ${ev.slice(0, 3).map(e => `<span class="ev ${e.status === '취소' || e.status === '변경' ? 'x' : ''}" style="--c:${h(e.color)}"><i>${clubEmoji(e.clubName) || '●'}</i><em>${h(e.clubName.replace(/동아리$/, ''))}</em></span>`).join('')}
      ${ev.length > 3 ? `<span class="ev more">+${ev.length - 3}</span>` : ''}</div>`;
  }
  const rest = (7 - ((first + days) % 7)) % 7;
  for (let i = 0; i < rest; i++) cells += '<div class="cal-cell blank"></div>';
  return `<div class="cal"><div class="cal-head">${WEEK.map((w, i) => `<div class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('')}</div><div class="cal-grid">${cells}</div></div>`;
}
const schStatusBadge = st => st === '취소' ? '<span class="badge b-abs">취소</span>' : st === '변경' ? '<span class="badge b-late">일정 변경</span>' : '';
function schCard(s, extra) {
  return `<div class="card sch ${s.status === '취소' ? 'canceled' : ''}" style="--c:${h(s.color)}">
    <div class="sch-top">${chip(s)}${schStatusBadge(s.status)}</div>
    <div class="sch-time">${h(s.start)} ~ ${h(s.end)}</div>
    <dl class="kv"><dt>장소</dt><dd>${h(s.place || '-')}</dd><dt>활동</dt><dd>${h(s.content || '-')}</dd>
    ${s.notes ? `<dt>안내</dt><dd>${h(s.notes)}</dd>` : ''}</dl>
    ${extra || ''}</div>`;
}

  return `<div class="sumgrid">${cell('rate', '출석률', '')}${cell('출석', '출석', 't-ok')}${cell('지각', '지각', 't-late')}${cell('결석', '결석', 't-abs')}${cell('미출석', '미출석', 't-none')}</div>`;
}
function recRow(r, extra) {
  return `<div class="lrow"><span class="dot" style="--c:${h(r.color)}"></span><div class="grow"><b>${fmtDate(r.date)}</b><small>${h(ce(r.clubName))}${r.time ? ' · ' + t5(r.time) : ''}${r.memo ? ' · ' + h(r.memo) : ''}</small></div>${badge(r.status)}${extra || ''}</div>`;
}
function renderSHist() {
  const f = SS.histClub, st = SS.histSt || '';
  const list = f ? SS.hist.filter(x => x.clubId === f) : SS.hist;
  const c = countList(list);
  const shown = st && st !== 'rate' ? list.filter(x => x.status === st) : list.slice(0, 4);
  $('#histBox').innerHTML = `
    <div class="filters"><button class="${!f ? 'on' : ''}" onclick="SS.histClub='';renderSHist()">전체</button>
      ${SS.home.clubs.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(cl => `<button class="${f === cl.id ? 'on' : ''}" onclick="SS.histClub='${cl.id}';renderSHist()">${h(ce(cl.name))}</button>`).join('')}</div>
    <div style="margin-top:10px">${sumCards(c, st || 'rate', 'sHistPick')}</div>
    <h3 class="sec-t">${st && st !== 'rate' ? `${h(st)} 날짜 <small class="muted">${shown.length}건</small>` : `최근 기록 <small class="muted">${shown.length}건</small>`}</h3>
    ${shown.length ? `<div class="card list">${shown.map(r => recRow(r)).join('')}</div>` : empty(st && st !== 'rate' ? `${st} 기록이 없어요` : '기록이 없습니다')}
    <p class="hint">숫자를 누르면 그 날짜들을 모두 볼 수 있어요. '출석률'을 누르면 다시 최근 4개만 보여줍니다. 취소·변경된 일정과 앞으로 있을 활동은 출석률에 넣지 않습니다.</p>`;
}
function sHistPick(k) { SS.histSt = (k === 'rate' || SS.histSt === k) ? '' : k; renderSHist(); }

function changePinS() {
  const cur = $('#pCur').value.trim(), n1 = $('#pNew').value.trim(), n2 = $('#pNew2').value.trim();
  if (!/^\d{4,6}$/.test(n1)) { toast('새 PIN은 숫자 4~6자리입니다', 'err'); return; }
  if (n1 === '0000') { toast('0000은 사용할 수 없어요', 'err'); return; }
  if (n1 !== n2) { toast('새 PIN이 서로 다릅니다', 'err'); return; }
  busy($('#pinBtn'), async () => {
    await api('s.changePin', { current: cur, next: n1 });
    toast('PIN이 변경되었습니다', 'ok');
    ['#pCur', '#pNew', '#pNew2'].forEach(s => { $(s).value = ''; });
  });

function saveBootCache() {
  try { Store.set('sc_boot', JSON.stringify({ today: AS.today, isSuper: AS.isSuper, admin: AS.admin, clubs: AS.allClubs, colors: AS.colors })); } catch (e) { /* 무시 */ }
}
function routeAdmin(b) {
  const saved = Store.get('sc_admin_view');
  if (b.clubs.length === 1) enterClub(b.clubs[0].id, true);
  else if (saved && (saved === 'ALL' || b.clubs.some(c => c.id === saved))) enterClub(saved, true);
  else renderPicker();
}
async function loadAdmin() {
  let cached = null;
  try { cached = JSON.parse(Store.get('sc_boot') || 'null'); } catch (e) { cached = null; }
  if (cached && cached.admin) { Object.assign(AS, cached); AS.allClubs = cached.clubs; routeAdmin(cached); }
  else app.innerHTML = LOADING;
  try {
    const b = await api('a.boot');
    const changed = !cached || JSON.stringify(cached.clubs) !== JSON.stringify(b.clubs) || cached.today !== b.today;
    Object.assign(AS, b);
    AS.allClubs = b.clubs;
    saveBootCache();
    if (!cached) routeAdmin(b);
    else if (changed && AS.viewClub) { AS.clubs = AS.viewClub === 'ALL' ? AS.allClubs.slice() : AS.allClubs.filter(c => c.id === AS.viewClub); }
    if (b.defaultPassword) toast('초기 비밀번호를 사용 중입니다. [설정 → 계정·설정]에서 변경하세요.', 'err');
  } catch (e) { if (!e.auth && !cached) app.innerHTML = `<div class="a-main">${errBox(e.message)}<p><button class="btn" onclick="loadAdmin()">다시 시도</button></p></div>`; }
}
/** 자주 쓰는 화면 데이터를 미리 받아두기 (탭 이동이 바로 보이도록) */
function prefetchAdmin() {
  const v = AS.viewClub;
  const later = (ms, f) => setTimeout(() => { if (AS.viewClub === v) f(); }, ms);
  later(600, () => { if (!AS.stu) api('a.students').then(d => { if (AS.viewClub === v && !AS.stu) AS.stu = d; }).catch(() => {}); });
  later(900, () => { if (!AS.clubList) api('a.clubs').then(d => { if (AS.viewClub === v && !AS.clubList) AS.clubList = d; }).catch(() => {}); });
  later(1200, () => {
    const ym = AS.schYM || AS.today.slice(0, 7), key = ym + '|' + (AS.schClub || '');
    AS.schCache = AS.schCache || {};
    if (!AS.schCache[key]) api('a.schedules', { ym, clubId: AS.schClub || '' }).then(d => { if (AS.viewClub === v) AS.schCache[key] = d; }).catch(() => {});
  });
  later(1500, () => {
    if (AS.attCache) return;
    api('a.attDay', { date: AS.today }).then(d => { if (AS.viewClub === v && !AS.attCache) { AS.attCache = { key: AS.today + '|' + (d.scheduleId || ''), d }; AS.attDate = AS.attDate || AS.today; AS.attSch = AS.attSch || d.scheduleId; } }).catch(() => {});
  });
}

function stat(label, v, unit, cls) { return `<div class="card stat ${cls || ''}"><small>${label}</small><b>${v}<i>${unit}</i></b></div>`; }
function attBadge(a) {
  const map = { ready: ['b-pri', '예정'], before: ['b-none', ((a && a.from) || '') + ' 출석 시작'], open: ['b-ok', '출석 진행 중'], closed: ['b-none', '출석 마감'], canceled: ['b-abs', '취소'] };
  const m = map[a && a.state] || map.ready;
  return `<span class="badge ${m[0]}">${h(m[1])}</span>`;
}
function renderDash(d) {

        <h3 class="sec-t">최근 출석 기록</h3>
        ${d.recent.length ? `<div class="card list">${d.recent.map(r => `<div class="lrow"><span class="dot" style="--c:${h(r.color)}"></span><div class="grow"><b>${h(r.name)} <small>${h(r.studentNo)}</small></b><small>${h(ce(r.clubName))} · ${fmtDate(r.date, 1)} ${t5(r.time)}</small></div>${badge(r.status)}</div>`).join('')}</div>` : empty('아직 출석 기록이 없습니다')}

function dashCard(c) {
  const present = c.counts['출석'] + c.counts['지각'];
  const pct = c.memberCount ? Math.round(present / c.memberCount * 100) : 0;
  return `<div class="card dcard ${c.status === '취소' ? 'canceled' : ''}" style="--c:${h(c.color)}">
    <div class="dc-top">${chip(c)}<span class="muted grow">${h(c.start)}~${h(c.end)} · ${h(c.place || '')}</span>${attBadge(c.att)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="dc-cnt"><span><b>${present}</b> / ${c.memberCount}명 (${pct}%)</span>
      <span class="t-ok">출석 ${c.counts['출석']}</span><span class="t-late">지각 ${c.counts['지각']}</span><span class="t-abs">결석 ${c.counts['결석']}</span><span class="t-none">미출석 ${c.unchecked}</span>
      <span style="flex:1"></span><button class="btn sm sec" onclick="goA('att',{date:'${c.date}',scheduleId:'${c.id}'})">출결 보기</button></div>
  </div>`;
}
function anomalyList(list) {
  if (!list || !list.length) return '<div class="muted" style="padding:6px 0">확인이 필요한 기록이 없습니다.</div>';
  return list.map(x => `<div class="anom"><span class="lv ${x.level}"></span><div style="flex:1;min-width:0">
    <b>${h(x.type)}</b> <small class="muted">${fmtDate(x.date, 1)} ${h(x.time)}${x.club ? ' · ' + h(x.club) : ''}</small>
    <div>${h(x.students)}</div><small class="muted">${h(x.detail)}</small></div></div>`).join('')
    + '<p class="hint">같은 기기를 가족·친구와 함께 쓰는 등 정상적인 경우도 있으니, 대리 출석으로 단정하지 말고 확인해 주세요.</p>';
}

function parseCSVLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out;
}
function parseBulk(text) {
  const rows = [];
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const cells = (line.includes('\t') ? line.split('\t') : parseCSVLine(line)).map(s => s.trim());
    if (!/^\d+$/.test(cells[0] || '')) return; // 머리글 줄 건너뜀
    rows.push({ line: i + 1, studentNo: cells[0], name: cells[1] || '', clubs: cells[2] || '' });
  });
  return rows;
}

async function setSt(studentId, status, btn) {
  const r = AS.board.rows.find(x => x.studentId === studentId);
  if ((r.status === status) || (!status && r.status === '미출석')) return;
  const before = r.status;
  // 화면 먼저 바꾸고(즉시 반응) 서버 저장은 뒤에서 처리
  const row = btn.closest('tr');
  const after = status || '미출석';
  r.status = after;
  row.querySelectorAll('.mini-seg button').forEach(b => { const st = b.textContent; b.className = st === after ? 'on ' + ST_CLASS[st] : ''; });
  row.children[2].innerHTML = badge(after);
  AS.saving = (AS.saving || 0) + 1;
  try {
    const res = await mut('a.setStatus', { scheduleId: AS.attSch, studentId, status }, 'a.board', { scheduleId: AS.attSch });
    AS.saving--;
    if (!AS.saving && $('#board')) { AS.board = res.view; renderBoard(); }
  } catch (e) {
    AS.saving--;
    r.status = before;
    if (!e.auth) { toast(e.message, 'err'); if ($('#board')) renderBoard(); }
  }
}

}

        ${stat('출석', c['출석'], '회', 'ok')}${stat('지각', c['지각'], '회', 'late')}${stat('결석', c['결석'], '회', 'abs')}${stat('미출석', c['미출석'], '회', 'abs')}</div>
      ${d.clubs.length > 1 ? `<h3 class="sec-t">동아리별 출석률</h3>
      <div class="card tbl-wrap"><table class="tbl"><thead><tr><th>동아리</th><th class="num">가입</th><th class="num">활동</th><th class="num">출석</th><th class="num">지각</th><th class="num">결석</th><th class="num">미출석</th><th class="num">누적 출석</th><th>출석률</th></tr></thead><tbody>
        ${d.clubs.map(x => `<tr><td>${chip(x)}</td><td class="num">${x.members}</td><td class="num">${x.sessions}</td><td class="num">${x.counts['출석']}</td><td class="num">${x.counts['지각']}</td><td class="num">${x.counts['결석']}</td><td class="num">${x.counts['미출석']}</td><td class="num"><b>${x.present}</b></td><td>${rateCell(x.rate)}</td></tr>`).join('')}
      </tbody></table></div>` : ''}
      <h3 class="sec-t">월별 출석 횟수</h3>
      ${d.monthly.months.length ? `<div class="card tbl-wrap"><table class="tbl"><thead><tr><th>월</th>${d.monthly.clubs.map(c => `<th class="num">${h(ce(c.name))}</th>`).join('')}<th class="num">합계</th></tr></thead><tbody>
        ${d.monthly.months.map(m => { const row = d.monthly.data[m] || {}; const sum = d.monthly.clubs.reduce((a, c) => a + (row[c.id] || 0), 0); return `<tr><td>${Number(m.slice(5))}월</td>${d.monthly.clubs.map(c => `<td class="num">${row[c.id] || 0}</td>`).join('')}<td class="num"><b>${sum}</b></td></tr>`; }).join('')}
      </tbody></table></div>` : empty('기간 안의 출석 기록이 없습니다')}
      <h3 class="sec-t">학생별 출석률 <small class="muted">${d.students.length}명</small>
        <span class="seg" style="margin:0 0 0 10px;vertical-align:middle">${[['no', '학번순'], ['low', '출석률 낮은 순'], ['high', '높은 순']].map(s => `<button class="${AS.stuSort === s[0] ? 'on' : ''}" onclick="AS.stuSort='${s[0]}';renderStuStats()">${s[1]}</button>`).join('')}</span></h3>
      <div class="card tbl-wrap" id="stuStats"></div>
      <p class="hint">출석률 = (출석 + 지각) ÷ 진행된 활동 수 (출석부 시트와 같은 기준). 취소·변경된 일정과 아직 끝나지 않은 오늘 활동은 제외합니다.</p>`;
    renderStuStats();
  } catch (e) { if (!e.auth) $('#srOut').innerHTML = errBox(e.message); }
}
function renderStuStats() {
  const list = AS.statData.students.slice();
  if (AS.stuSort === 'low') list.sort((a, b) => (a.rate === null ? 999 : a.rate) - (b.rate === null ? 999 : b.rate));
  if (AS.stuSort === 'high') list.sort((a, b) => (b.rate === null ? -1 : b.rate) - (a.rate === null ? -1 : a.rate));
  $$('#attBody h3 .seg button').forEach(b => b.classList.toggle('on', b.getAttribute('onclick').includes(`'${AS.stuSort}'`)));
  $('#stuStats').innerHTML = `<table class="tbl resp"><thead><tr><th>학번</th><th>이름</th><th>동아리</th><th class="num">대상</th><th class="num">출석</th><th class="num">지각</th><th class="num">결석</th><th class="num">미출석</th><th>출석률</th></tr></thead><tbody>
    ${list.map(s => `<tr><td class="m-key">${h(s.studentNo)}</td><td class="m-key"><b class="m-name">${h(s.name)}</b></td><td class="m-full m-sub"><small>${h(s.clubs)}</small></td><td class="num m-sub"><span class="m-only">대상 </span>${s.expected}</td><td class="num m-sub"><span class="m-only t-ok">출석 </span>${s.counts['출석']}</td><td class="num m-sub"><span class="m-only t-late">지각 </span>${s.counts['지각']}</td><td class="num m-sub"><span class="m-only t-abs">결석 </span>${s.counts['결석']}</td><td class="num m-sub"><span class="m-only">미출석 </span>${s.counts['미출석']}</td><td class="m-full">${rateCell(s.rate)}</td></tr>`).join('') || '<tr><td colspan="10" class="muted" style="text-align:center;padding:20px">데이터가 없습니다</td></tr>'}
  </tbody></table>`;
}
function dlTab() {
  const types = [['students', '전체 학생 명단', '학번 · 이름 · 가입 동아리 · 상태 · PIN 상태'], ['members', '동아리별 가입 학생 명단', '동아리 · 학번 · 이름 · 가입일'],
    ['daily', '날짜별 출석 명단', '기간 안 각 활동의 학생별 출결 (미출석 포함)'], ['records', '학생별 출결 기록', '출석 인증 시간 · 기기 정보 포함 원자료'],
    ['clubStats', '동아리별 출석 통계', '동아리별 출석·지각·결석 횟수와 출석률'], ['studentStats', '학생별 출석 통계', '학생별 출석률']];
  $('#stBody').innerHTML = rangeBar('dr', true) + `<div class="card list dl-list">${types.map(t => `<div class="lrow"><div class="grow"><b>${t[1]}</b><small>${t[2]}</small></div>
      <button class="btn sm" onclick="doExport('${t[0]}','xlsx',this)">엑셀</button><button class="btn sm ghost" onclick="doExport('${t[0]}','csv',this)">CSV</button><button class="btn sm ghost" onclick="doExport('${t[0]}','sheet',this)">구글 시트</button></div>`).join('')}</div>
    <p class="hint">위의 기간·동아리 조건이 적용됩니다(학생 명단 제외 기간 무관). 내려받기가 되지 않으면 '구글 시트'를 눌러 새 시트로 만든 뒤 파일 → 다운로드 하세요.</p>`;
  $('#drGo').onclick = () => { readRange('dr'); toast('조건을 적용했습니다', 'ok'); };
}
function doExport(type, fmt, btn) {
  readRange('dr');
  const p = { type, from: AS.stFrom, to: AS.stTo, clubId: AS.statClub };
  busy(btn, async () => {
    if (fmt === 'sheet') {
      const r = await api('a.exportSheet', p);
      openModal(`<h2>구글 시트로 만들었습니다</h2><p class="muted">내 구글 드라이브에 저장되었습니다.</p>
        <div class="m-actions"><a class="btn ghost" href="${h(r.xlsx)}" target="_blank">xlsx로 받기</a><a class="btn" href="${h(r.url)}" target="_blank">시트 열기</a></div>`);
      return;
    }
    const d = await api('a.export', p);
    const rows = [d.header].concat(d.rows);
    if (fmt === 'csv') downloadCSV(d.title, rows);
    else { try { await downloadXLSX(d.title, rows); } catch (e) { downloadCSV(d.title, rows); toast('엑셀 대신 CSV로 내려받았습니다'); } }
  });
}
async function anomTab() {
  AS.anFrom = AS.anFrom || addDays(AS.today, -7);
  AS.anTo = AS.anTo || AS.today;
  $('#stBody').innerHTML = `<div class="toolbar"><input type="date" class="inp" id="anF" value="${AS.anFrom}"> ~ <input type="date" class="inp" id="anT" value="${AS.anTo}"><button class="btn" id="anGo">조회</button></div><div id="anOut">${LOADING}</div>`;
  $('#anGo').onclick = () => { AS.anFrom = $('#anF').value; AS.anTo = $('#anT').value; anomTab(); };
  try {
    const list = await api('a.anomalies', { from: AS.anFrom, to: AS.anTo });
    $('#anOut').innerHTML = `<div class="card">${anomalyList(list)}</div>
      <div class="card" style="margin-top:12px"><b>확인 기준</b><ul class="muted" style="margin:6px 0 0;padding-left:18px;font-size:13.5px">
        <li><span class="flag">빨강</span> 짧은 시간(10분) 안에 같은 기기로 여러 계정 출석</li>
        <li><span class="flag">주황</span> 같은 날 같은 기기로 여러 계정 출석</li>
        <li><span class="flag">회색</span> 기존 기기가 있는 학생이 새 기기에서 로그인</li></ul></div>`;
  } catch (e) { if (!e.auth) $('#anOut').innerHTML = errBox(e.message); }
}
async function setTab() {
  const body = $('#stBody');
  body.innerHTML = `<div class="a-cols set-cols">
    <section><div class="card"><h3>내 비밀번호 변경</h3><p class="muted" style="margin:4px 0 12px">${h(AS.admin.name)} (${h(AS.admin.loginId)})</p>
      <label class="field"><span>현재 비밀번호</span><input type="password" class="inp" id="mpCur"></label>
      <label class="field"><span>새 비밀번호 (6자 이상)</span><input type="password" class="inp" id="mpNew"></label>
      <label class="field"><span>새 비밀번호 확인</span><input type="password" class="inp" id="mpNew2"></label>
      <button class="btn block" id="mpBtn">변경</button></div></section>
    <section id="admBox">${AS.isSuper ? LOADING : '<div class="card muted">관리자 계정 관리는 총괄 관리자만 사용할 수 있습니다.</div>'}</section></div>`;
  $('#mpBtn').onclick = e => {
    if ($('#mpNew').value !== $('#mpNew2').value) { toast('새 비밀번호가 서로 다릅니다', 'err'); return; }
    busy(e.currentTarget, async () => { await api('a.myPassword', { current: $('#mpCur').value, next: $('#mpNew').value }); toast('비밀번호를 변경했습니다', 'ok'); ['#mpCur', '#mpNew', '#mpNew2'].forEach(s => { $(s).value = ''; }); });
  };
  if (!AS.isSuper) return;
  try {
    const d = await api('a.admins');
    AS.adm = d;
    const cm = Object.fromEntries(d.clubs.map(c => [c.id, c]));
    $('#admBox').innerHTML = `<div class="card"><div class="dc-top"><h3 class="grow">관리자 계정</h3><button class="btn sm" onclick="editAdmin()">+ 교사 추가</button></div>
      <p class="hint" style="margin-bottom:10px">총괄 관리자는 모든 동아리를, 담당 교사는 지정한 동아리만 관리합니다.</p>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>아이디</th><th>이름</th><th>권한</th><th>담당 동아리</th><th>상태</th><th></th></tr></thead><tbody>
      ${d.admins.map(x => `<tr><td><b>${h(x.loginId)}</b></td><td>${h(x.name)}</td><td>${x.role === '총괄' ? '<span class="badge b-pri">총괄</span>' : '<span class="badge b-none">담당</span>'}</td>
        <td>${x.role === '총괄' ? '<small class="muted">전체</small>' : x.clubIds.map(id => cm[id] ? chip(cm[id]) : '').join(' ') || '<small class="muted">없음</small>'}</td>
        <td>${x.status === '활성' ? '<span class="badge b-ok">활성</span>' : '<span class="badge b-none">비활성</span>'}</td>
        <td class="act"><button class="btn sm ghost" onclick="editAdmin('${x.id}')">수정</button>${x.id !== AS.admin.id ? `<button class="btn sm danger" onclick="deleteAdmin('${x.id}')">삭제</button>` : ''}</td></tr>`).join('')}
      </tbody></table></div></div>`;
  } catch (e) { if (!e.auth) $('#admBox').innerHTML = errBox(e.message); }
}
function editAdmin(id) {
  const x = id ? AS.adm.admins.find(a => a.id === id) : { loginId: '', name: '', role: '담당', clubIds: [], status: '활성' };
  openModal(`<h2>${id ? '관리자 수정' : '교사 계정 추가'}</h2>
    <div class="row2"><label class="field"><span>아이디 (영문/숫자)</span><input class="inp" id="adId" value="${h(x.loginId)}" autocapitalize="off"></label>
    <label class="field"><span>이름</span><input class="inp" id="adName" value="${h(x.name)}"></label></div>
    <label class="field"><span>${id ? '새 비밀번호 (바꿀 때만 입력)' : '비밀번호 (6자 이상)'}</span><input type="password" class="inp" id="adPw" autocomplete="new-password"></label>
    <div class="row2"><label class="field"><span>권한</span><select class="inp" id="adRole"><option value="담당" ${x.role === '담당' ? 'selected' : ''}>담당 교사</option><option value="총괄" ${x.role === '총괄' ? 'selected' : ''}>총괄 관리자</option></select></label>
    <label class="field"><span>상태</span><select class="inp" id="adSt"><option ${x.status === '활성' ? 'selected' : ''}>활성</option><option ${x.status === '비활성' ? 'selected' : ''}>비활성</option></select></label></div>
    <label class="field"><span>담당 동아리 (담당 교사만 해당)</span><div class="checks">${AS.adm.clubs.map(c => `<label><input type="checkbox" name="adClub" value="${c.id}" ${x.clubIds.includes(c.id) ? 'checked' : ''}><span class="dot" style="--c:${h(c.color)}"></span>${h(ce(c.name))}</label>`).join('')}</div></label>
    <div class="m-actions"><button class="btn ghost" onclick="closeModal()">취소</button><button class="btn" id="adSave">저장</button></div>`);
  $('#adSave').onclick = e => busy(e.currentTarget, async () => {
    await api('a.adminSave', { id, loginId: $('#adId').value, name: $('#adName').value, password: $('#adPw').value, role: $('#adRole').value, status: $('#adSt').value, clubIds: $$('input[name=adClub]:checked').map(c => c.value) });
    closeModal(); toast('저장했습니다', 'ok'); setTab();
  });
}
async function deleteAdmin(id) {
  const x = AS.adm.admins.find(a => a.id === id);
  if (!(await ask(`관리자 '${x.name}(${x.loginId})' 계정을 삭제할까요?`, '삭제', true))) return;
  await busy(null, async () => { await api('a.adminDelete', { id }); toast('삭제했습니다', 'ok'); setTab(); });
}

boot();
</script>
</body>
</html>
